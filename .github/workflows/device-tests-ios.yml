name: Device tests (iOS)

# UI tests of the example app on an iOS simulator. They need a full native build, so they run on
# demand and on ready (not draft) pull requests that change code the iOS app is built from. Jest
# tests and Markdown do not trigger them.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'packages/liquid-glass/ios/**'
      - 'packages/liquid-glass/src/**'
      - 'packages/liquid-glass/*.podspec'
      - 'packages/liquid-glass/package.json'
      - 'example/**'
      - '!example/android/**'
      - '!example/__tests__/**'
      - '!**/*.md'
      - 'package-lock.json'
      - 'scripts/run-ios-ui-tests.mjs'
      - '.github/workflows/device-tests-ios.yml'
permissions:
  contents: read
concurrency:
  group: device-tests-ios-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    name: iOS lifecycle, menus and visual tiers
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-26
    timeout-minutes: 90
    env:
      RCT_USE_PREBUILT_RNCORE: '0'
      # React Native is compiled from source; ccache keeps the compiled C, C++ and Objective-C
      # between runs, so later runs on the same pull request (or after one on main) rebuild only
      # what changed. The Podfile routes the compilers through it when USE_CCACHE is 1.
      USE_CCACHE: '1'
      CCACHE_DIR: ${{ github.workspace }}/../ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # React Native's compiler wrapper runs "$CCACHE_BINARY clang". Pods sets CCACHE_BINARY only as
      # a build setting, which Xcode does not pass to compile tasks; without it in the environment
      # the wrapper silently runs plain clang. Environment variables do reach the compiles.
      - name: Install ccache
        run: |
          brew install ccache
          echo "CCACHE_BINARY=$(command -v ccache)" >> "$GITHUB_ENV"
      - name: Restore the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../ccache
          key: ios-ccache-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ios-ccache-${{ hashFiles('package-lock.json') }}-
            ios-ccache-
      - name: Install iOS pods
        working-directory: example/ios
        run: |
          pod install
          ccache --zero-stats
      # Cold-launch first taps, tab rebuilds before and after attach, per-tab artwork and colours,
      # icon buttons and programmatic menus, the surface tiers in light and dark, and the menu
      # panel. A Release build carries its JavaScript: a Debug launch fails when a busy Metro
      # misses the app's startup check.
      - name: Run UI tests
        env:
          ALG_DERIVED_DATA: ${{ runner.temp }}/DerivedData
        run: >
          node scripts/run-ios-ui-tests.mjs --configuration Release --result artifacts/DeviceTests.xcresult --log artifacts/device-tests.log
          testTabBarLifecycleAndFirstTap testTabBarArtworkAndTints testIconButtonsAndProgrammaticMenu testVisualTiers testGlassMenuPanel
      - name: Compiler cache statistics
        if: always()
        run: ccache --show-stats || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-${{ github.sha }}
          path: |
            artifacts/DeviceTests.xcresult
            artifacts/device-tests.log
          retention-days: 14
