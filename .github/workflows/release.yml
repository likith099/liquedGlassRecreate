name: Release

# The existing npm trusted publisher remains bound to this workflow filename.
# Only a version tag with reviewed source and documented deferrals can reach the OIDC publish job.
# Native builds and device tests are not run here: the release candidate is verified locally
# (simulator and emulator checks, and the packed Release consumer that builds both native apps),
# and that evidence is what release/acceptance.json records.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    name: Verify source and acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/__tests__/*.test.mjs
      - run: npm run typecheck
      - run: npm test
      - run: node scripts/check-pack.mjs
      - name: Require matching tag, source review and documented deferrals
        run: node scripts/check-release-acceptance.mjs
  release:
    name: Publish verified release
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Use tested npm with trusted publishing support
        run: npm install -g npm@11.12.1
      - run: npm ci
      - run: node scripts/check-release-acceptance.mjs
      - run: node scripts/check-pack.mjs
      - name: Publish with provenance
        run: npm publish --workspace @likith99/react-native-adaptive-liquid-glass --access public --provenance
